name: Release

# Pushing a `v*` tag, or running this workflow by hand on main (which creates
# the tag for the workspace version), builds every artifact and publishes a
# GitHub Release with the matching CHANGELOG.md section as its notes. A pull
# request that touches this file runs the same builds without publishing.
# Running it by hand with `add_zed_to` set to an existing tag instead builds
# only that tag's Zed extension package and adds it to that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      add_zed_to:
        description: "Existing release tag to add the Zed extension package to (leave empty to cut a release)"
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CHANGELOG.md

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.add_zed_to || github.ref }}
      - id: v
        shell: bash
        env:
          ADD_ZED_TO: ${{ inputs.add_zed_to }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$ADD_ZED_TO" ]]; then
            if [[ "$ADD_ZED_TO" != "v$version" ]]; then
              echo "::error::$ADD_ZED_TO has the workspace version $version"
              exit 1
            fi
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::run the release from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::v$version is already tagged; bump the version first"
              exit 1
            fi
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

  cli:
    needs: version
    if: inputs.add_zed_to == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p vfl-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=vfl-v${{ needs.version.outputs.version }}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/vfl.exe "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" > /dev/null)
          else
            cp target/${{ matrix.target }}/release/vfl "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  notepadpp:
    needs: version
    if: inputs.add_zed_to == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p vfl-npp
      - name: Package
        shell: bash
        run: |
          name=vfl_npp-v${{ needs.version.outputs.version }}-x64
          mkdir -p dist/vfl_npp
          cp target/release/vfl_npp.dll dist/vfl_npp/
          cp editors/notepadpp/README.md LICENSE-MIT LICENSE-APACHE dist/vfl_npp/
          (cd dist && 7z a "$name.zip" vfl_npp > /dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: notepadpp
          path: dist/*.zip

  vscode:
    needs: version
    if: inputs.add_zed_to == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Check the extension version
        run: |
          ext=$(node -p "require('./package.json').version")
          if [ "$ext" != "${{ needs.version.outputs.version }}" ]; then
            echo "::error::editors/vscode/package.json is $ext, the workspace is ${{ needs.version.outputs.version }}"
            exit 1
          fi
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: editors/vscode/*.vsix

  # The Zed extension as a zip of its sources: Zed installs it with
  # "zed: install dev extension" and compiles it itself. Building it here
  # makes sure the packaged sources compile.
  zed:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.add_zed_to || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Check the extension version
        shell: bash
        working-directory: editors/zed
        run: |
          for file in extension.toml Cargo.toml; do
            ext=$(sed -n 's/^version = "\(.*\)"/\1/p' "$file" | head -n1)
            if [ "$ext" != "${{ needs.version.outputs.version }}" ]; then
              echo "::error::editors/zed/$file is $ext, the workspace is ${{ needs.version.outputs.version }}"
              exit 1
            fi
          done
      - run: cargo build --release --locked --target wasm32-wasip2
        working-directory: editors/zed
      - name: Package
        shell: bash
        run: |
          name=vfl-zed-v${{ needs.version.outputs.version }}
          mkdir dist
          git archive --format=zip --prefix=vfl-zed/ -o "dist/$name.zip" HEAD:editors/zed
          unzip -l "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: zed
          path: dist/*.zip

  # `add_zed_to`: adds the Zed package to an existing release, and its
  # checksum to that release's SHA256SUMS.
  add-zed:
    needs: [version, zed]
    if: inputs.add_zed_to != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zed
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.add_zed_to }}
        run: |
          cd dist
          gh release download "$TAG" --pattern SHA256SUMS
          zip=$(ls vfl-zed-*.zip)
          grep -v " $zip\$" SHA256SUMS > SHA256SUMS.new || true
          sha256sum "$zip" >> SHA256SUMS.new
          sort -k2 SHA256SUMS.new > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" "$zip" SHA256SUMS --clobber

  publish:
    needs: [version, cli, notepadpp, vscode, zed]
    if: inputs.add_zed_to == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          version=${{ needs.version.outputs.version }}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "vfl $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Tag and publish the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v${{ needs.version.outputs.version }}
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "vfl $tag" --notes-file notes.md
