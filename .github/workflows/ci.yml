name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  notepadpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: i686-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p vfl-npp --all-targets
      # The 32-bit and ARM64 plugins of the release.
      - run: cargo check -p vfl-npp --target i686-pc-windows-msvc --target aarch64-pc-windows-msvc
      - run: cargo build --release -p vfl-npp
      - uses: actions/upload-artifact@v4
        with:
          name: vfl_npp
          path: target/release/vfl_npp.dll

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .corpus
          key: corpus-${{ hashFiles('scripts/corpus.sh') }}
      - run: scripts/corpus.sh

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p vfl-cli
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: xvfb-run -a npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vfl-vscode
          path: editors/vscode/*.vsix

  # The Zed extension: builds to WebAssembly, and its queries compile
  # against the grammars pinned in extension.toml.
  zed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g tree-sitter-cli@0.25.10
      - run: cargo fmt --check
        working-directory: editors/zed
      - run: cargo clippy --target wasm32-wasip2
        working-directory: editors/zed
      # The download checks (checksum, archive extraction) run natively.
      - run: cargo test
        working-directory: editors/zed
      - run: editors/zed/check.sh

  # The Neovim, Emacs, Vim and Helix setups in editors/, in those editors,
  # and the syntax of every JSON and TOML file under editors/.
  editors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-editor-configs.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p vfl-cli
      - name: Install Neovim, Emacs, Vim and Helix
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends emacs-nox vim
          curl -sSfL https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          curl -sSfL https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz \
            | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/helix-25.07.1-x86_64-linux" >> "$GITHUB_PATH"
          echo "HELIX_RUNTIME=$RUNNER_TEMP/helix-25.07.1-x86_64-linux/runtime" >> "$GITHUB_ENV"
      - run: PATH="$PWD/target/debug:$PATH" REQUIRE_ALL=1 editors/test/run.sh

  # A short run of each fuzz target (see fuzz/README.md), from the seed
  # corpus. Longer runs are for local use.
  fuzz:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: actions/cache@v4
        id: cargo-fuzz
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: fuzz/seed.sh
      - run: cargo +nightly fuzz build -s none
        working-directory: fuzz
      - name: Fuzz each target for 45 seconds
        working-directory: fuzz
        run: |
          for target in parse format verilog format_verilog lint reanalyze lsp; do
            echo "::group::$target"
            cargo +nightly fuzz run -s none "$target" "corpus/$target" -- \
              -dict=hdl.dict -max_total_time=45 -max_len=16384 -timeout=30
            echo "::endgroup::"
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
