[package]
name = "vfl-zed"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Built to WebAssembly by Zed (or `cargo build --target wasm32-wasip2`), so it
# stays out of the main workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
zed_extension_api = "0.7.0"
