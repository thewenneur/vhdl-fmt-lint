[package]
name = "vhone-npp"
description = "Notepad++ plugin that formats and lints VHDL with vhone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Notepad++ loads `plugins\vhone_npp\vhone_npp.dll`.
name = "vhone_npp"
crate-type = ["cdylib"]

# The workspace forbids unsafe code; the Win32 glue needs it, so it is
# denied here and allowed only in the modules that call Windows.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
vhone-config.workspace = true
vhone-doc.workspace = true
vhone-fmt.workspace = true
vhone-lsp.workspace = true
vhone-project.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
