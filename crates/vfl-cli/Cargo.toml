[package]
name = "vfl-cli"
description = "The vfl command-line tool: VHDL formatter and linter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vfl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vfl-config.workspace = true
vfl-doc.workspace = true
vfl-fmt.workspace = true
vfl-gen.workspace = true
vfl-lint.workspace = true
vfl-lsp.workspace = true
vfl-project.workspace = true
vfl-syntax.workspace = true
vfl-verilog-syntax.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
similar.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

# `cargo binstall` downloads the release archives built by
# .github/workflows/release.yml instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/vfl-v{ version }-{ target }{ archive-suffix }"
bin-dir = "vfl-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
